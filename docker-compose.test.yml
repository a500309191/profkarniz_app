name: profkarniz-tests
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-disposable
      POSTGRES_DB: profkarniz_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d profkarniz_test"]
      interval: 2s
      timeout: 3s
      retries: 20
  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://test:test-only-disposable@postgres:5432/profkarniz_test
    command: ["sh", "-c", "npm run check && npm run test:integration"]
    depends_on:
      postgres:
        condition: service_healthy
