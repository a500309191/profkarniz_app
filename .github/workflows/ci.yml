name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-disposable
          POSTGRES_DB: profkarniz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d profkarniz_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test-only-disposable@127.0.0.1:5432/profkarniz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:compose
      - run: npm run test:integration
      - run: docker build --target runtime -t profkarniz-app:ci .
      - run: npm run test:production-cli
